# Single public entry point (the only published port). Serves the console, proxies the BFF API,
# the ingest API and Keycloak, so the browser only ever talks to one origin.

limit_req_zone $binary_remote_addr zone=ingest:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Behind the Codespaces/cloud TLS proxy, keep the original scheme and host.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }
map $http_x_forwarded_host $fwd_host { default $http_x_forwarded_host; '' $http_host; }
map $fwd_proto $fwd_port { https 443; default $server_port; }

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $core http://event-core:8080;
    set $idp  http://keycloak:8080;

    proxy_http_version 1.1;
    proxy_set_header Host              $fwd_host;
    proxy_set_header X-Forwarded-Host  $fwd_host;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Port  $fwd_port;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_hide_header X-Powered-By;

    # Management endpoints are internal only (port 8081); never route them.
    location ^~ /actuator { return 404; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Live updates: server-sent events, never buffered.
    location = /api/stream {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $core;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # Machine ingest (bearer tokens).
    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=ingest burst=400 nodelay;
        proxy_pass $core;
    }

    # Console BFF: API, OAuth2 login/callback, logout.
    location ~ ^/(api|oauth2|login|logout)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $core;
    }

    # Identity provider.
    location /auth/realms/pip/login-actions/ {
        limit_req zone=login burst=20 nodelay;
        proxy_pass $idp;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    location /auth/ {
        proxy_pass $idp;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Single-page app.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /usr/share/nginx/html;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
