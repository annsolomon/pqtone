global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: event-core
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["event-core:8081"]}]
  - job_name: rules-engine
    metrics_path: /metrics
    static_configs: [{targets: ["rules-engine:8082"]}]
