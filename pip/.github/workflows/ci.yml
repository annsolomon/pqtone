name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: build, test, score, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Renovate pins every action to a commit SHA (see renovate.json).
      - uses: actions/checkout@v4
      - name: make all
        run: make all SEED=42
      - name: Quality report
        if: always()
        run: |
          for f in .work/reports/offline/score.md .work/reports/e2e/score.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Scan built images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: pip/event-core:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan rules-engine image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: pip/rules-engine:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/compose/docker-compose.yml logs --no-color --tail=300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: .work/reports
      - name: Propose new quality baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-candidate
          path: .work/reports/offline/baseline.candidate.json
      - if: always()
        run: make down

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose

  dependencies:
    name: dependency and config scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
