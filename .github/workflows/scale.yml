name: scale
# Milestone R5: the scale test. Manual only (it takes ~30 minutes of runner time). Results are
# uploaded as an artifact and also committed to a new branch perf/scale-results-<run id>, from which
# the numbers in pip/docs/perf/rules-engine.md are reviewed and merged by pull request.
on:
  workflow_dispatch:
    inputs:
      stores:
        description: Simulated stores
        default: "50"
      duration:
        description: Simulated duration per run (ISO-8601)
        default: PT30M
      ladder:
        description: "standard: threads 1/2/4 at 40x, then 10x and 160x; stress: 640x and 2560x at 2 and 4 threads; both"
        type: choice
        options: [standard, stress, both]
        default: both

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: scale
  cancel-in-progress: false

jobs:
  ladder:
    name: scale ladder
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only to push the results branch; never main (branch name is fixed below)
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Runner
        run: |
          nproc; free -h; docker version --format '{{.Server.Version}}'
          { echo "### Runner"; echo; echo "\`$(nproc)\` vCPU, \`$(free -h | awk '/Mem:/{print $2}')\` RAM, ubuntu-24.04 hosted runner"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and start the stack
        run: make build up 2>&1 | tee "$RUNNER_TEMP/up.log"
      - name: Scale ladder
        env:
          STORES: ${{ inputs.stores }}
          DURATION: ${{ inputs.duration }}
          LADDER: ${{ inputs.ladder }}
        run: |
          [[ "$STORES" =~ ^[0-9]{1,3}$ ]] || { echo "stores must be a number"; exit 2; }
          [[ "$DURATION" =~ ^PT[0-9HMS]+$ ]] || { echo "duration must be like PT30M"; exit 2; }
          case "$LADDER" in standard) targets=scale-ladder ;; stress) targets=scale-stress ;; both) targets="scale-ladder scale-stress" ;; *) echo "bad ladder"; exit 2 ;; esac
          for t in $targets; do make "$t" STORES="$STORES" DURATION="$DURATION" 2>&1 | tee -a "$RUNNER_TEMP/scale.log"; done
          cat .work/reports/scale/rules-engine.md >> "$GITHUB_STEP_SUMMARY"
      - name: Failure details
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/compose/docker-compose.yml logs --no-color --tail=200 rules-engine event-core || true
      - name: Publish results to a branch for review
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="perf/scale-results-${RUN_ID}"
          mkdir -p docs/perf/results
          cp .work/reports/scale/rules-engine.md docs/perf/rules-engine-measured.md
          cp .work/reports/scale/rules-engine-*.svg docs/perf/
          for d in .work/reports/scale/*/; do cp "$d/result.json" "docs/perf/results/$(basename "$d").json"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/perf
          git commit -m "perf(rules): scale ladder results from run ${RUN_ID} (milestone R5)"
          git push origin "$branch"
          echo "Results pushed to \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scale
          path: pip/.work/reports/scale
          if-no-files-found: warn
      - if: always()
        run: make down
