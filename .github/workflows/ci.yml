name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# An explicit `shell: bash` runs steps with -eo pipefail; the implicit default is plain
# `bash -e`, which lets `cmd | tee log` pass even when cmd fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (Renovate keeps the pins current, see
# renovate.json). trivy-action stays on v0.35.0 / Trivy v0.69.3: the releases verified
# clean after the March 2026 tag-hijack incident (CVE-2026-33634).

jobs:
  unit:
    name: unit tests (make test-fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pip/services/*/pom.xml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pip/web/ops-console/package-lock.json
      - name: Schema compatibility (every catalog version accepts what the previous one accepted)
        run: python3 scripts/schema-compat.py
      - name: make test-fast
        run: |
          make dev-setup 2>&1 | tee "$RUNNER_TEMP/test-fast.log"
          make test-fast 2>&1 | tee -a "$RUNNER_TEMP/test-fast.log"
      - name: Failure details
        if: failure()
        run: |
          grep -nE "ERROR|FAIL|Error:|error TS|AssertionError|Tests run:.*Fail" "$RUNNER_TEMP/test-fast.log" > "$RUNNER_TEMP/test-fast-errors.log" || true
          ../.github/scripts/annotate.sh "test-fast errors" "$RUNNER_TEMP/test-fast-errors.log" 60
          ../.github/scripts/annotate.sh "test-fast (last lines)" "$RUNNER_TEMP/test-fast.log" 60

  pipeline:
    name: build, test, score, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: pip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        # The hosted runner starts with ~10 GB free; the stack, images and reports need more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pip/services/*/pom.xml
      - name: make all
        run: make all SEED=42 2>&1 | tee "$RUNNER_TEMP/make-all.log"
      - name: Quality report
        if: always()
        run: |
          for f in .work/reports/offline/score.md .work/reports/e2e/score.md .work/reports/ui/axe.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          python3 ../.github/scripts/score-annotate.py "offline score" .work/reports/offline/score.json
          python3 ../.github/scripts/score-annotate.py "e2e score" .work/reports/e2e/score.json
      - name: Test counts
        if: always()
        run: |
          python3 ../.github/scripts/test-summary.py "e2e test counts" .work/reports
          python3 ../.github/scripts/test-summary.py "integration test counts" services/event-core/target/failsafe-reports
      - name: Scan event-core image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: pip/event-core:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-event-core.json
      - name: Scan rules-engine image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: pip/rules-engine:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-rules-engine.json
      - name: Failure details
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/compose/docker-compose.yml logs --no-color --tail=300 \
            > "$RUNNER_TEMP/stack.log" 2>&1 || true
          cat "$RUNNER_TEMP/stack.log"
          ../.github/scripts/annotate.sh "make all (last lines)" "$RUNNER_TEMP/make-all.log" 60
          grep -E "ERROR|Exception|FATAL|panic" "$RUNNER_TEMP/stack.log" | grep -v "^grafana" > "$RUNNER_TEMP/stack-errors.log" || true
          ../.github/scripts/annotate.sh "stack errors" "$RUNNER_TEMP/stack-errors.log" 40
          python3 ../.github/scripts/trivy-summary.py "$RUNNER_TEMP/trivy-event-core.json" "$RUNNER_TEMP/trivy-rules-engine.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: pip/.work/reports
          if-no-files-found: warn
      - name: Upload the browser demo video
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-demo
          path: |
            pip/.work/reports/ui/*.webm
            pip/.work/reports/ui/*.png
          if-no-files-found: warn
      - name: Propose new quality baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-candidate
          path: pip/.work/reports/offline/baseline.candidate.json
      - if: always()
        run: make down

  # Milestone Q1: one sticky PR comment with the score and its delta against the base branch's
  # baseline. A separate job so only it holds pull-requests: write. Fork PRs get a read-only
  # token, so they are skipped; pushes to main never comment.
  score-comment:
    name: score comment
    needs: pipeline
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true   # a missing artifact still gets a comment saying so
        with:
          name: reports
          path: ${{ runner.temp }}/reports
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render and post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          base_sha="$(git rev-parse --short "origin/$BASE_REF")"
          git show "origin/$BASE_REF:pip/scorer/baseline.json" > "$RUNNER_TEMP/baseline.json"
          PYTHONPATH=pip/scorer python3 -m pip_scorer.comment \
            --offline "$RUNNER_TEMP/reports/offline/score.json" \
            --e2e "$RUNNER_TEMP/reports/e2e/score.json" \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --baseline-ref "$BASE_REF@$base_sha" \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/comment.md"
          .github/scripts/sticky-comment.sh "$PR" "$RUNNER_TEMP/comment.md"

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --redact --verbose

  dependencies:
    name: dependency and config scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig   # secrets: gitleaks (secret scan job)
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: ${{ runner.temp }}/trivy-fs.json
      - name: Failure details
        if: failure()
        run: python3 .github/scripts/trivy-summary.py "$RUNNER_TEMP/trivy-fs.json"

  # Private repositories without GitHub Advanced Security cannot upload to code scanning,
  # so results stay in the run: high and critical findings fail the job, and the SARIF is
  # kept as an artifact for review.
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: warn
      - name: Fail on high or critical findings
        run: python3 .github/scripts/sarif-gate.py codeql-results 7.0 .github/codeql-accepted.json
