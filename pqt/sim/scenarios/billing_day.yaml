name: billing_day
description: >-
  X1 B2: a normal two-hour trading period with billing on. Every served shopper gets a bill; payments by
  tender, a few refunds and voids, a delivery, stock snapshots and the billing system's day totals.
  No planted anomalies: the reconcile job must find nothing.
duration: PT2H
arrivals:
  - {from: PT0S, to: PT2H, perHour: 110}
billing:
  catalogue: ../../config/catalogue/store-001.json
  basketMeanLines: 4
  tenders: {cash: 0.35, upi: 0.5, card: 0.15}
  splitTenderProbability: 0.05
  refundProbability: 0.02
  voidProbability: 0.03
  noSalePerHour: 1
  priceOverrideProbability: 0.01
  stockSnapshotEvery: PT30M
  deliveries:
    - {at: PT20M, docNo: PB-1001, lines: [{sku: MILK-1L, qty: 48}, {sku: BREAD-400G, qty: 24}]}
