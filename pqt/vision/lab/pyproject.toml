[project]
name = "pqt-vision"
version = "0.1.0"
description = "PQT vision-lab: person detection, tracking, zones and events from camera video (Tier 2)"
requires-python = ">=3.12"
# Licences are recorded in docs/adr/012-detector-and-licences.md. Pins match sim/ where shared (numpy).
dependencies = [
  "numpy==2.1.2",
  "opencv-python-headless==4.10.0.84",
  "onnxruntime==1.20.1",
  "scipy==1.14.1",
  "pyarrow==18.1.0",
  "PyYAML==6.0.2",
  "jsonschema==4.23.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
pqt-vision = "pqt_vision.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pqt_vision*"]

[tool.setuptools.package-data]
pqt_vision = ["*.schema.json"]
