[project]
name = "pqt-edge"
version = "0.1.0"
description = "PQT edge agent: RTSP ingest, perception, SQLite outbox and uplink (Tier 2, Project 8)"
requires-python = ">=3.12"
# pqt-vision brings the detector, tracker, zones and emitter (licences: docs/adr/012-detector-and-licences.md).
dependencies = ["pqt-vision", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
pqt-edge = "pqt_edge.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pqt_edge*"]
