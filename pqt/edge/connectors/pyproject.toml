[project]
name = "pqt-connectors"
version = "0.1.0"
description = "PQT billing connectors (X1): billing-system exports to X1 CloudEvents through the edge outbox"
requires-python = ">=3.12"
# PyYAML (MIT) for profiles, jsonschema (MIT) for pre-send validation; both already used by store-sim.
# openpyxl (MIT, with et-xmlfile, MIT) reads Excel sources (B5a); defusedxml (PSF-2.0) makes openpyxl's XML
# parsing refuse entity expansion and external entities, and parses TallyPrime XML later (B5e). ADR-037.
# The edge outbox comes from pqt-edge, installed on the box; it is imported only with --outbox.
dependencies = ["PyYAML==6.0.2", "jsonschema==4.23.0", "openpyxl==3.1.5", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
# Database sources (B5c), installed only on boxes that read that kind of database. psycopg is LGPL-3.0, used
# unmodified as a library (the binary wheel bundles libpq, PostgreSQL licence); PyMySQL MIT; pyodbc MIT-0 (it
# needs the database vendor's ODBC driver on the box).
postgresql = ["psycopg[binary]==3.2.3"]
mysql = ["PyMySQL==1.1.1"]
sqlserver = ["pyodbc==5.2.0"]

[project.scripts]
pqt-connectors = "pqt_connectors.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pqt_connectors*"]

[tool.setuptools.package-data]
pqt_connectors = ["schemas/*.json"]
