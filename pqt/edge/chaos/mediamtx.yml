# Simulated camera for the edge chaos test (A1): MediaMTX (MIT) serves a synthetic FFmpeg test pattern
# as RTSP. No footage of people anywhere.
logLevel: warn
rtmp: no
hls: no
webrtc: no
srt: no
paths:
  cam1:
    runOnInit: ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=640x360:rate=10 -c:v mjpeg -q:v 8 -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
