# Simulated camera for the edge chaos test (A1): MediaMTX (MIT) serves a synthetic FFmpeg test pattern
# as RTSP. No footage of people anywhere.
# info: publisher and reader sessions (open, close and why) appear in `docker compose logs cam-sim`.
logLevel: info
rtmp: no
hls: no
webrtc: no
srt: no
paths:
  cam1:
    # RTP/JPEG (RFC 2435) needs the standard Huffman tables; FFmpeg's encoder defaults to optimised ones,
    # which its RTP packetiser refuses, so no frame was ever sent and MediaMTX dropped the silent publisher
    # after its 10 s read timeout. Publish over TCP as well.
    runOnInit: ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc2=size=640x360:rate=10 -pix_fmt yuvj420p -c:v mjpeg -huffman default -q:v 8 -f rtsp -rtsp_transport tcp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
