# Measured by pqt-vision bench-mot17 (milestone N1). Rates and distributions only.
# Source: CI run on PR #46 (commit 31dc2fcb), MOT17-02/04/09, yolox_s roi, ByteTrack defaults.
apiVersion: noise.pqt/v1
name: mot17-yolox-s-roi
description: Measured on MOT17 fixed-camera sequences with yolox_s (roi mode), ByteTrack defaults and the V4 zone
  engine (open-dataset track).
measuredFrom:
  clips: 3
  trackMinutes: 4.35
  cameras:
  - mot17-02
  - mot17-04
  - mot17-09
  measuredAt: '2026-10-12'
  notes: 'Open-dataset track (ADR-013): MOT17 fixed-camera sequences, zones from ground truth. queueCountError is zone occupancy
    error from 1-second samples, not 10-second queue samples. Replace with a profile from our own footage at P5.'
