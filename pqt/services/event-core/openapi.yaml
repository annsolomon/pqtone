openapi: 3.1.0
info:
  title: PQT event-core
  version: 1.0.0
  description: |
    Ingest gate for CloudEvents and the operations-console API (BFF).
    Errors use RFC 9457 problem details (application/problem+json) with a stable `code`.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /auth/realms/pqt/protocol/openid-connect/token
          scopes: {}
    session:
      type: apiKey
      in: cookie
      name: PQTSESSION
      description: Server-side session from the OIDC login at /oauth2/authorization/keycloak. State-changing calls also need the X-XSRF-TOKEN header (value of the XSRF-TOKEN cookie).
  schemas:
    Problem:
      type: object
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        errors: {type: array, items: {type: string}}
    CloudEvent:
      $ref: ../../schemas/envelope.schema.json
    RuleScores:
      type: object
      required: [windowDays, generatedAt, rules]
      properties:
        windowDays: {type: integer}
        generatedAt: {type: string, format: date-time}
        rules:
          type: array
          items:
            type: object
            properties:
              ruleId: {type: string}
              ruleVersion: {type: string}
              mode: {type: string, enum: [enforce, shadow]}
              runs: {type: integer}
              lastMeasuredAt: {type: string, format: date-time}
              lastRunId: {type: string}
              lastScenario: {type: string}
              tp: {type: integer}
              fp: {type: integer}
              fn: {type: integer}
              precision: {type: number, nullable: true}
              recall: {type: number, nullable: true}
              precisionLow: {type: number, nullable: true, description: 95% Wilson lower bound}
              recallLow: {type: number, nullable: true}
              precisionMin: {type: number}
              recallMin: {type: number}
              minN: {type: integer, nullable: true}
              minLowerBound: {type: number, nullable: true}
              ready: {type: boolean, description: Shadow rule meets the enforce gate with enough evidence}
              reasons: {type: array, items: {type: string}}
    Timeline:
      type: object
      required: [incidentId, from, to, onsetAt, detectedAt, kind, series, markers, truncated]
      properties:
        incidentId: {type: string, format: uuid}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        onsetAt: {type: string, format: date-time}
        detectedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        threshold: {type: integer, nullable: true, description: Queue threshold the rule used, when it has one}
        kind: {type: string, enum: [queue, zone, none]}
        target: {type: string, nullable: true, description: Queue id or zone id}
        series:
          type: array
          maxItems: 5000
          description: Queue points (t, length, openRegisters) or zone buckets (t, entries); the first queue point carries the last value seen before the window
          items:
            type: object
            required: [t]
            properties:
              t: {type: string, format: date-time}
              length: {type: integer}
              openRegisters: {type: integer, nullable: true}
              entries: {type: integer}
        markers:
          type: array
          maxItems: 500
          description: In time order. Queue incidents also carry the till events of the tills serving the queue (X1 B7).
          items:
            type: object
            properties:
              t: {type: string, format: date-time}
              kind: {type: string, enum: [register.opened, register.closed, till.void, till.refund, till.no_sale, till.price_override, till.drawer_open, till.shift_open, till.shift_close]}
              registerId: {type: string, description: The register, which is also the till id}
              amountMinor: {type: [integer, "null"], format: int64, description: Till events only}
              currency: {type: [string, "null"], description: Till events only}
        truncated: {type: boolean, description: More than 5000 points matched; the series stops at the limit}
    EdgeHealth:
      type: object
      required: [storeId, generatedAt, staleAfterSeconds, agents]
      properties:
        storeId: {type: string}
        generatedAt: {type: string, format: date-time}
        staleAfterSeconds: {type: integer}
        agents:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              agentId: {type: string}
              source: {type: string}
              at: {type: string, format: date-time, description: Event time of the agent's latest heartbeat}
              stale: {type: boolean, description: No heartbeat for longer than staleAfterSeconds}
              agentVersion: {type: string}
              uptimeSeconds: {type: integer}
              alarms: {type: array, items: {type: string}}
              cameras: {type: array, items: {type: object}}
              outbox: {type: object}
              connectors:
                type: array
                description: Billing connector sources on the box (edge.heartbeat 1.1.0); empty for older agents
                items:
                  type: object
                  properties:
                    id: {type: string}
                    type: {type: string, enum: [watch, sql, http, tally, push]}
                    ok: {type: boolean}
                    stale: {type: boolean}
                    failures: {type: integer}
                    lastSuccessAgeSeconds: {type: [integer, "null"]}
                    events: {type: integer}
                    rowErrors: {type: integer}
              clockOffsetMs: {type: [integer, "null"]}
    ReviewMetrics:
      type: object
      required: [days, generatedAt, rules]
      properties:
        days: {type: integer}
        generatedAt: {type: string, format: date-time}
        rules:
          type: array
          items:
            type: object
            properties:
              ruleId: {type: string}
              incidents: {type: integer}
              acted: {type: integer, description: Incidents with at least one review action}
              decided: {type: integer, description: Incidents whose latest decision is confirm or dismiss}
              confirmed: {type: integer}
              dismissed: {type: integer}
              undecided: {type: integer}
              confirmRate: {type: number, nullable: true}
              confirmRateLow: {type: number, nullable: true, description: 95% Wilson lower bound; the conservative precision estimate}
              confirmRateHigh: {type: number, nullable: true}
              timeToActionP50Seconds: {type: number, nullable: true}
              timeToActionP90Seconds: {type: number, nullable: true}
              dismissReasons: {type: object, additionalProperties: {type: integer}}
    IngestResult:
      type: object
      properties:
        status: {type: string, enum: [accepted, duplicate]}
        source: {type: string}
        id: {type: string}
    Incident:
      type: object
      properties:
        incidentId: {type: string, format: uuid}
        ruleId: {type: string}
        ruleVersion: {type: string}
        mode: {type: string, enum: [enforce, shadow]}
        storeId: {type: string}
        simRunId: {type: [string, "null"]}
        key: {type: string}
        subject: {type: [string, "null"]}
        severity: {type: string, enum: [low, medium, high]}
        summary: {type: string}
        onsetAt: {type: string, format: date-time}
        detectedAt: {type: string, format: date-time}
        resolvedAt: {type: [string, "null"], format: date-time}
        status: {type: string, enum: [OPEN, ACKNOWLEDGED, CONFIRMED, DISMISSED, AUTO_RESOLVED, CLOSED]}
        version: {type: integer}
    BillingWindow:
      type: object
      properties:
        storeId: {type: string}
        simRunId: {type: [string, "null"], description: null for live data}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    Sales:
      allOf:
        - $ref: "#/components/schemas/BillingWindow"
        - type: object
          properties:
            bucket: {type: string, enum: ["15m", hour, day]}
            timeZone: {type: string}
            tillId: {type: [string, "null"]}
            buckets:
              type: array
              items:
                type: object
                properties:
                  start: {type: string, format: date-time}
                  currency: {type: string}
                  bills: {type: integer}
                  salesMinor: {type: integer, format: int64}
                  taxMinor: {type: integer, format: int64}
                  lines: {type: integer, format: int64}
                  voidedBills: {type: integer}
            totals:
              type: array
              description: Per currency, over the whole window.
              items: {type: object}
    Payments:
      allOf:
        - $ref: "#/components/schemas/BillingWindow"
        - type: object
          properties:
            bucket: {type: string, enum: ["15m", hour, day]}
            timeZone: {type: string}
            tillId: {type: [string, "null"]}
            buckets:
              type: array
              items:
                type: object
                properties:
                  start: {type: string, format: date-time}
                  currency: {type: string}
                  tender: {type: string, enum: [cash, card, upi, wallet, credit, voucher, other]}
                  inMinor: {type: integer, format: int64}
                  outMinor: {type: integer, format: int64}
                  netMinor: {type: integer, format: int64}
                  paymentsIn: {type: integer}
                  paymentsOut: {type: integer}
            totals:
              type: array
              description: Per currency and tender, over the whole window.
              items: {type: object}
    Traffic:
      allOf:
        - $ref: "#/components/schemas/BillingWindow"
        - type: object
          properties:
            bucket: {type: string, enum: ["15m", hour, day]}
            timeZone: {type: string}
            entranceZones: {type: array, items: {type: string}, description: The layout's entrance zones; visitors are entries into them}
            truncated: {type: boolean, description: Too many queue-length events; the queue figures stop at the limit}
            buckets:
              type: array
              description: Every bucket in the window, empty ones included, so they line up with the sales buckets
              items:
                type: object
                properties:
                  start: {type: string, format: date-time}
                  visitors: {type: [integer, "null"], description: null when the layout has no entrance zone}
                  queues:
                    type: array
                    items:
                      type: object
                      properties:
                        queueId: {type: string}
                        meanLength: {type: [number, "null"], description: Time-weighted mean; null when nothing is known for the bucket}
                        maxLength: {type: [integer, "null"]}
    Stock:
      allOf:
        - $ref: "#/components/schemas/BillingWindow"
        - type: object
          properties:
            skus:
              type: array
              items:
                type: object
                properties:
                  sku: {type: string}
                  unit: {type: string}
                  inMilli: {type: integer, format: int64, description: Thousandths of the unit}
                  outMilli: {type: integer, format: int64}
                  netMilli: {type: integer, format: int64}
                  inByReason: {type: object, additionalProperties: {type: integer, format: int64}}
                  outByReason: {type: object, additionalProperties: {type: integer, format: int64}}
                  movements: {type: integer}
                  level:
                    type: [object, "null"]
                    description: The latest reported level at or before `to`
                    properties:
                      qtyMilli: {type: integer, format: int64}
                      at: {type: string, format: date-time}
            next: {type: [string, "null"], description: The `after` value for the next page; null on the last page}
  parameters:
    BillingStore: {name: storeId, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]{1,64}$"}}
    BillingFrom: {name: from, in: query, required: true, description: Start of the window (inclusive), RFC 3339, schema: {type: string, format: date-time}}
    BillingTo: {name: to, in: query, required: true, description: End of the window (exclusive); at most 35 days after from (7 for hourly, 2 for 15-minute buckets), schema: {type: string, format: date-time}}
    BillingBucket: {name: bucket, in: query, description: "15m (at most 2 days), hour (at most 7 days) or day", schema: {type: string, enum: ["15m", hour, day], default: day}}
    BillingTz: {name: tz, in: query, description: IANA time zone for the buckets, schema: {type: string, default: Asia/Kolkata}}
    BillingTill: {name: till, in: query, schema: {type: string, pattern: "^[a-z0-9-]{1,64}$"}}
    BillingRun: {name: run, in: query, description: A simulator run id; omit for live data, schema: {type: string, pattern: "^run-[a-f0-9]{12}$"}}
paths:
  /v1/events:
    post:
      summary: Ingest one event
      security: [{clientCredentials: []}]
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema: {$ref: "#/components/schemas/CloudEvent"}
      responses:
        "202": {description: Accepted, content: {application/json: {schema: {$ref: "#/components/schemas/IngestResult"}}}}
        "200": {description: Duplicate of an already accepted event (idempotent success)}
        "400": {description: Contract violation, content: {application/problem+json: {schema: {$ref: "#/components/schemas/Problem"}}}}
        "401": {description: Missing or invalid token}
        "403": {description: Client may not publish for this source}
        "409": {description: Same (source, id) already accepted with a different payload}
        "413": {description: Event larger than 64 KiB}
        "415": {description: Wrong content type}
        "429": {description: Rate limited; see Retry-After}
  /v1/events/batch:
    post:
      summary: Ingest up to 500 events; per-item results
      security: [{clientCredentials: []}]
      requestBody:
        required: true
        content:
          application/cloudevents-batch+json:
            schema: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/CloudEvent"}}
      responses:
        "200":
          description: Per-item status accepted | duplicate | conflict | invalid | forbidden
  /api/me:
    get: {summary: Current user and roles, security: [{session: []}], responses: {"200": {description: OK}, "401": {description: Not signed in}}}
  /api/stores:
    get: {summary: Known stores, security: [{session: []}], responses: {"200": {description: OK}}}
  /api/stores/{storeId}/layout:
    get:
      summary: Floor plan
      security: [{session: []}]
      parameters: [{name: storeId, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]{1,64}$"}}]
      responses: {"200": {description: OK}, "404": {description: Unknown store}}
  /api/stores/{storeId}/state:
    get:
      summary: Current occupancy and queue state for the store's latest run
      security: [{session: []}]
      parameters: [{name: storeId, in: path, required: true, schema: {type: string}}]
      responses: {"200": {description: OK}}
  /api/stores/{storeId}/sales:
    get:
      summary: Bills and sales per 15 minutes, hour or day in the store's time zone (X1 B3)
      description: |
        Each bill counts once, at its latest revision, unless that revision was voided (then it is in voidedBills);
        its time is the first line of that revision. The same rules as the daily reconcile (ADR-034). Money is in
        minor units. Bucket starts are UTC instants of the local hour or midnight.
      security: [{session: []}]
      parameters:
        - $ref: "#/components/parameters/BillingStore"
        - $ref: "#/components/parameters/BillingFrom"
        - $ref: "#/components/parameters/BillingTo"
        - $ref: "#/components/parameters/BillingBucket"
        - $ref: "#/components/parameters/BillingTz"
        - $ref: "#/components/parameters/BillingTill"
        - $ref: "#/components/parameters/BillingRun"
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {$ref: "#/components/schemas/Sales"}}}
        "400": {description: A parameter is invalid (problem code bad-store-id, bad-time, bad-window, window-too-long, bad-bucket, bad-time-zone, bad-till or bad-run)}
  /api/stores/{storeId}/payments:
    get:
      summary: Money in and out per tender, per 15 minutes, hour or day (X1 B3)
      security: [{session: []}]
      parameters:
        - $ref: "#/components/parameters/BillingStore"
        - $ref: "#/components/parameters/BillingFrom"
        - $ref: "#/components/parameters/BillingTo"
        - $ref: "#/components/parameters/BillingBucket"
        - $ref: "#/components/parameters/BillingTz"
        - $ref: "#/components/parameters/BillingTill"
        - $ref: "#/components/parameters/BillingRun"
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {$ref: "#/components/schemas/Payments"}}}
        "400": {description: A parameter is invalid}
  /api/stores/{storeId}/edge:
    get:
      summary: The store's edge boxes and their billing connectors (X1 B5f)
      description: The latest heartbeat of each edge agent of the store in the last 7 days, with cameras, outbox, alarms and billing connector health. Operational data only.
      security: [{session: []}]
      parameters: [{name: storeId, in: path, required: true, schema: {type: string, pattern: "^[a-z0-9-]{1,64}$"}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EdgeHealth"}
        "400": {description: Invalid store id}
  /api/stores/{storeId}/traffic:
    get:
      summary: Visitors and queue lengths in the same buckets as the sales (X1 B7)
      description: Visitors are entries into the layout's entrance zones (not counting tracks that appeared inside a zone, as the footfall rule); queue figures are the time-weighted mean and the peak of each queue's length. Counts only, never a track id.
      security: [{session: []}]
      parameters:
        - $ref: "#/components/parameters/BillingStore"
        - $ref: "#/components/parameters/BillingFrom"
        - $ref: "#/components/parameters/BillingTo"
        - $ref: "#/components/parameters/BillingBucket"
        - $ref: "#/components/parameters/BillingTz"
        - $ref: "#/components/parameters/BillingRun"
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {$ref: "#/components/schemas/Traffic"}}}
        "400": {description: A parameter is invalid}
        "404": {description: Unknown store}
  /api/stores/{storeId}/stock:
    get:
      summary: Stock in and out per SKU and reason, with the latest reported level (X1 B3)
      description: Paged by SKU in byte order; pass the response's `next` as `after` for the next page.
      security: [{session: []}]
      parameters:
        - $ref: "#/components/parameters/BillingStore"
        - $ref: "#/components/parameters/BillingFrom"
        - $ref: "#/components/parameters/BillingTo"
        - {name: after, in: query, schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 200}}
        - $ref: "#/components/parameters/BillingRun"
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {$ref: "#/components/schemas/Stock"}}}
        "400": {description: A parameter is invalid}
  /api/events/recent:
    get:
      summary: Most recent events for a store
      security: [{session: []}]
      parameters:
        - {name: storeId, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 200, default: 50}}
      responses: {"200": {description: OK}}
  /api/stream:
    get:
      summary: Server-sent events (hello, events, incident)
      security: [{session: []}]
      responses: {"200": {description: text/event-stream}}
  /api/pipeline/health:
    get: {summary: Rules-engine liveness from heartbeats, security: [{session: []}], responses: {"200": {description: ok or degraded}}}
  /api/incidents:
    get:
      summary: List incidents (shadow mode requires admin)
      security: [{session: []}]
      parameters:
        - {name: mode, in: query, schema: {type: string, enum: [enforce, shadow], default: enforce}}
        - {name: status, in: query, description: comma-separated, schema: {type: string}}
        - {name: storeId, in: query, schema: {type: string}}
        - {name: ruleId, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, maximum: 500, default: 100}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Incident"}}}}}
        "403": {description: Shadow incidents need admin}
  /api/incidents/{id}:
    get:
      summary: Incident with review history; ETag carries the version
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: OK}, "404": {description: Not found}}
  /api/incidents/{id}/timeline:
    get:
      summary: >-
        Evidence around an incident in event time (milestone C4): queue length and open registers with
        register markers for queue incidents, zone entries per minute for zone incidents. Window is
        onset - 10 min to resolution + 5 min, at most 2 h. Same visibility as GET /api/incidents/{id}.
      security: [{session: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Timeline"}
        "404": {description: Not found (or a shadow incident and the caller is not an admin)}
  /api/incidents/{id}/actions:
    post:
      summary: Review action (ack = operator; confirm, dismiss, close = reviewer)
      security: [{session: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
        - {name: X-XSRF-TOKEN, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [ack, confirm, dismiss, close]}
                reasonCode: {type: string, enum: [FALSE_POSITIVE, DUPLICATE, EXPECTED_BEHAVIOUR, TEST_EVENT, OTHER]}
                note: {type: string, maxLength: 500}
      responses:
        "200": {description: Updated incident; new ETag}
        "400": {description: Missing reason or invalid action}
        "403": {description: Role or CSRF failure}
        "409": {description: Invalid transition or shadow incident}
        "412": {description: Stale If-Match}
        "428": {description: If-Match missing}
  /api/admin/audit:
    get:
      summary: Recent audit entries (admin)
      security: [{session: []}]
      parameters: [{name: limit, in: query, schema: {type: integer, maximum: 500, default: 100}}]
      responses: {"200": {description: OK}}
  /api/admin/review-metrics:
    get:
      summary: >-
        Review metrics per rule for enforce incidents created in the last `days` (milestone C5): time from the
        incident reaching the console to the first review action (p50, p90, wall clock), confirm rate over
        decided incidents with a 95% Wilson interval, undecided count and dismiss reasons. Admin only.
      security: [{session: []}]
      parameters: [{name: days, in: query, schema: {type: integer, minimum: 1, maximum: 90, default: 30}}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewMetrics"}
        "400": {description: days outside 1..90}
        "403": {description: Admins only}
  /api/admin/rule-scores:
    get:
      summary: >-
        Live (e2e) score per rule accumulated over the runs of its current version in the last 30 days,
        with a promotion verdict for shadow rules (milestone R6). Admin only and read-only: promotion is a
        reviewed pull request (docs/runbooks/RB-11-promote-shadow-rule.md), never a toggle.
      security: [{session: []}]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RuleScores"}
        "403": {description: Admins only}
  /api/admin/audit/verify:
    get: {summary: Recompute the hash chain (admin), security: [{session: []}], responses: {"200": {description: "{valid, rows, brokenAtSeq?}"}}}
  /logout:
    post: {summary: End the session; returns the IdP end-session URL, security: [{session: []}], responses: {"200": {description: "{logoutUrl}"}}}
