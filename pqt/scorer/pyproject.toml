[project]
name = "pqt-scorer"
version = "1.0.0"
description = "Scores rule incidents against simulator ground truth and gates CI"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.2", "psycopg[binary]==3.2.3"]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
pqt-scorer = "pqt_scorer.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pqt_scorer*"]
